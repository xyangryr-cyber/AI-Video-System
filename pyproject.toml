[project]
name = "ai-video-system"
version = "0.0.0"
description = "AI video production system — internal."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-bdd>=7.1",
  "pytest-xdist>=3.5",
  "deepeval>=1.0",
  "pydantic>=2.5",
  "ruff>=0.4",
  "mypy>=1.8",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.20",
]

[tool.pytest.ini_options]
markers = [
  "contract: API contract shape tests; run with `pytest -m contract`. Validate request/response schemas against spec contracts.",
  "eval: agent eval set; run with `pytest tests/eval/ --eval-mode` (HARNESS §10.2). Skipped in default unit/integration runs.",
  "bdd: pytest-bdd scenario wrapper; tag-selectable via `-m '<tag>'`.",
  "router: IntentRouter BDD scenarios (auto-tagged by pytest-bdd from @router feature tag).",
  "preferences: PreferenceExtractor BDD scenarios (auto-tagged by pytest-bdd from @preferences feature tag).",
  "safety: SafetyPolicyEngine BDD scenarios (auto-tagged by pytest-bdd from @safety feature tag).",
  "observability: Observability / alerting BDD scenarios (auto-tagged by pytest-bdd from @observability feature tag).",
  "gatekeeper: GateKeeper BDD scenarios (auto-tagged by pytest-bdd from @gatekeeper feature tag).",
  "phase4: Phase 4 TTS / async audio generation BDD scenarios (auto-tagged by pytest-bdd from @phase4 feature tag).",
  "phase5: Phase 5 BGM generation / skip-branch BDD scenarios (auto-tagged by pytest-bdd from @phase5 feature tag).",
  "phase6: Phase 6 SFX planning / overlay BDD scenarios (auto-tagged by pytest-bdd from @phase6 feature tag).",
  "phase8: Phase 8 keyframe render / degradation BDD scenarios (auto-tagged by pytest-bdd from @phase8 feature tag).",
  "phase10: Phase 10 rough-cut composition BDD scenarios (auto-tagged by pytest-bdd from @phase10 feature tag).",
  "phase11: Phase 11 final-delivery / completion BDD scenarios (auto-tagged by pytest-bdd from @phase11 feature tag).",
  "preferences-2: Audio writeback / scope-suggestion BDD scenarios for features/preferences-2.feature.",
  "error_ux: Error-tier / modal-vs-toast / recovery-action BDD scenarios for features/error_ux.feature.",
  "navigation: Project-list / workflow navigation / history-view BDD scenarios (auto-tagged by pytest-bdd from @navigation feature tag).",
  "performance: Nonfunctional latency / reconnect-recovery BDD scenarios (auto-tagged by pytest-bdd from @performance feature tag).",
  "classification: Intent classification BDD scenarios (auto-tagged by pytest-bdd from @classification feature tag).",
]
bdd_features_base_dir = "tests"

[tool.mypy]
explicit_package_bases = true
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
  "E402",  # module-level imports (FastAPI setup pattern)
  "E501",  # line length
  "B008",  # FastAPI Depends() in defaults is standard
  "B007",  # loop control variable style
  "B904",  # raise from err (style)
  "C401",  # set comprehension style
  "F401",  # re-exported imports
  "F821",  # dynamic names
  "F841",  # unused vars (handled by type checker)
  "N802",  # generated SDK uses camelCase
  "N806",  # function-level constants use _UPPER_CASE
  "N815",  # shared schemas mirror TypeScript mixedCase
  "N818",  # exception naming conventions
  "SIM",   # refactoring suggestions, not errors
  "UP007", # X | Y annotation style
  "UP038", # isinstance union style
]
exclude = [
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  ".pytest_cache",
  "build",
  "dist",
  "node_modules",
  "prototype",
  "migrations",
  ".worktrees",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
