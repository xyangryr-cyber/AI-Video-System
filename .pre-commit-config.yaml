repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, ts, json, yaml, markdown, css]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.14.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types: [file]
        args: [--fix]
        additional_dependencies:
          - eslint@9.14.0
          - typescript-eslint
          - eslint-plugin-react
          - eslint-plugin-react-hooks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/backend/
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
